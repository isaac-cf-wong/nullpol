name: CI
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
    workflow_call:

jobs:
    test:
        strategy:
            matrix:
                # Locked resolutions run everywhere; the SPEC 0 minimum
                # (lowest-direct) runs on ubuntu with the oldest supported
                # Python, since floor versions predate newer interpreters'
                # wheels.
                python-version: ['3.13', '3.14']
                os: [ubuntu-latest, macos-latest]
                resolution: [locked]
                include:
                    - os: ubuntu-latest
                      python-version: '3.13'
                      resolution: lowest-direct
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: 'true'

            - name: Install dependencies
              shell: bash
              env:
                  RESOLUTION: ${{ matrix.resolution }}
              run: |
                  if [ "$RESOLUTION" = "lowest-direct" ]; then
                      uv sync --group dev --upgrade --resolution lowest-direct
                  else
                      uv sync --group dev --frozen
                  fi

            - name: Run tests with pytest
              run: uv run --no-sync pytest

            - name: Upload coverage to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}

    integration:
        # Runs the @pytest.mark.integration suite once (not in the matrix) to
        # keep the fast unit-test matrix cheap while still gating on the
        # heavier integration tests. Installs the optional `asimov` extra so
        # real asimov/cbcflow paths can be exercised now and in the future.
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: '3.13'
                  enable-cache: 'true'

            - name: Install dependencies (with asimov extra)
              run: uv sync --group dev --extra asimov --frozen

            - name: Run integration tests
              # Clear the default addopts (which selects `-m 'not integration'`)
              # and explicitly select the integration marker instead.
              run:
                  uv run --frozen pytest -o addopts="" -m integration --cov src
                  --cov-report=term-missing
